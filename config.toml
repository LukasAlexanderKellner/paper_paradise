# Central configuration for the MCP server and the newsletter pipeline.
# Credentials and recipients do NOT belong here; they go into environment variables (.env or GitHub Secrets).

[profile]
# Basis for the semantic ranking of arXiv papers and GitHub repos
description = """
Data Science and AI student in 5th semester. Interested in Machine Learning,
Deep Learning architectures, PyTorch implementation, Transformer models,
Distributed Systems, GPU memory optimization, and Cloud Computing infrastructure.
"""
# Items containing these terms in title/description are dropped (applies to all sources)
exclude_keywords = ["quantum", "bioinformatics"]

[sources]
arxiv_categories = ["cs.LG", "cs.AI", "cs.DC"]
# GitHub ANDs multiple topics, so each topic is queried separately
github_topics = ["pytorch", "machine-learning", "deep-learning", "llm"]
blog_feeds = [
    "https://pytorch.org/blog/feed/",
    "https://huggingface.co/blog/feed.xml",
    "https://alphasignal.ai/feed.xml",
]

[newsletter]
window_days = 7
subject = "paper_porn Weekly: AI & ML of the past week"
# Sender address. Leave empty to use SMTP_USER. Can be overridden with NEWSLETTER_SENDER.
sender = ""
# Recipients come exclusively from the NEWSLETTER_RECIPIENTS environment variable (comma-separated).
state_file = "state/sent_items.json"
# Sent items are removed from the state file after this many days
state_retention_days = 180

[newsletter.top_k]
arxiv = 5
huggingface = 5
github = 5
blogs = 5

[newsletter.arxiv]
# Upper limit for the weekly query (cs.LG + cs.AI + cs.DC yield roughly 2,000-2,500 papers per week)
max_fetch = 3000

[newsletter.github]
min_stars = 20
max_fetch = 30

[llm]
# Optional Gemini summary at the top ("This week's highlight: ...", 5-6 sentences, highlight takeaways),
# a glossary of the hardest terms and "why it matters" per item. Skipped if GEMINI_API_KEY is not set.
enabled = true
model = "gemini-3.8-flash"
# Terms the reader already knows; they never go into the glossary. Extend this list to fine-tune it.
glossary_known_terms = [
    "machine learning", "deep learning", "neural network", "transformer", "attention", "LLM",
    "large language model", "GPU", "CPU", "PyTorch", "training", "inference", "fine-tuning",
    "dataset", "benchmark", "accuracy", "embedding", "token", "parameter", "gradient descent",
    "overfitting", "loss function", "API", "open source", "cloud", "agent", "prompt",
]
