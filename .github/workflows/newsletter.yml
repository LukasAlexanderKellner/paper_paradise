name: Weekly newsletter

on:
  schedule:
    # Cron runs in UTC. Monday 09:30 Europe/Berlin is 07:30 UTC in summer (CEST)
    # and 08:30 UTC in winter (CET). Both are scheduled; the gate job keeps the matching one.
    # Off the full hour on purpose: GitHub delays or drops many scheduled runs at :00.
    # TEMP: daily instead of Monday-only ("* * *" -> "* * 1"), to check whether GitHub fires the
    # schedule in this repo at all. Revert both cron lines and both gate checks below afterwards.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: render HTML only (as artifact), send nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Compare the cron that fired with Berlin's current UTC offset. This stays correct
          # even when GitHub starts a scheduled run late, which happens regularly.
          offset=$(TZ=Europe/Berlin date +%z)
          if [ "$EVENT" != "schedule" ]; then
            run=true
          elif [ "$SCHEDULE" = "30 7 * * *" ] && [ "$offset" = "+0200" ]; then
            run=true
          elif [ "$SCHEDULE" = "30 8 * * *" ] && [ "$offset" = "+0100" ]; then
            run=true
          else
            run=false
          fi
          echo "Event=$EVENT Schedule='$SCHEDULE' Berlin offset=$offset -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  newsletter:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          # CPU-only torch first, otherwise pip pulls the multi-GB CUDA build on Linux
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Run newsletter
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          NEWSLETTER_SENDER: ${{ secrets.NEWSLETTER_SENDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python runner.py --dry-run
          else
            python runner.py
          fi

      - name: Upload dry-run output
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-preview
          path: out/

      - name: Commit state file
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/sent_items.json
          if git diff --cached --quiet; then
            echo "State unchanged."
            exit 0
          fi
          git commit -m "chore: update newsletter state [skip ci]"
          git pull --rebase
          git push
